[package]
name = "xpass"
version = "0.4.0"
description = "Zero-knowledge personal password manager"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "xpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3.7", default-features = false }
base64 = "0.22"
keyring = { version = "3.6", features = ["windows-native"] }
# Sync transport (S13): async, rustls, no cookies/charset/compression.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
xpass-core = { path = "../crates/xpass-core" }
xpass-interop = { path = "../crates/xpass-interop" }
serde = { version = "1", features = ["derive"] }
rand = "0.8"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
url = "2"
uuid = "1"
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3.1.1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# WinRT: Windows Hello (KeyCredentialManager); COM: file dialogs.
windows = { version = "0.62", features = [
    "Foundation",
    # Native open / save dialogs (IFileOpenDialog / IFileSaveDialog).
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
