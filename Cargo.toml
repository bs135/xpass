[workspace]
resolver = "2"
members = ["crates/xpass-core", "src-tauri"]
# Spikes are standalone crates kept for reference until v0.3.
exclude = ["spikes"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["bs135"]
repository = "https://github.com/bs135/xpass"
rust-version = "1.85"

[profile.release]
codegen-units = 1
lto = true
strip = true
