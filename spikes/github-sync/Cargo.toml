[package]
name = "github-sync-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Spike: offline-first multi-device sync of the xpass vault via the GitHub Contents API"

# Standalone crate, not part of any workspace.
[workspace]

[lib]
name = "sync_spike"

[[bin]]
name = "sync-spike"
path = "src/main.rs"

[dependencies]
vault-format-spike = { path = "../vault-format" }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
rand_chacha = "0.3"
tempfile = "3"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
