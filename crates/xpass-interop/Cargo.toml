[package]
name = "xpass-interop"
version = "0.1.0"
description = "xpass import / export: CSV presets, duplicate detection, CSV writer (no UI, no OS bindings)"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde"] }
xpass-core = { path = "../xpass-core" }
zeroize = { version = "1", features = ["derive"] }
