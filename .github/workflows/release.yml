name: Release
# Adapted from xmark. Windows only.
#
# The version is bumped on `develop` in the release PR (`npm run release:prepare`,
# checked by the `version` job in ci.yml), so this workflow never pushes to `main`
# (v0.6 plan H10): on a push to `main` it reads the version from package.json and,
# if the tag `v<version>` does not exist yet, creates it through the API and builds
# the release. A merge without a version bump releases nothing.
# Needs "Settings > Actions > General > Workflow permissions" = "Read and write
# permissions" (tag and release creation).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    name: Read version and create tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
      released: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "Tag ${tag} already exists: nothing to release (no version bump in this merge)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # package.json, package-lock.json, src-tauri/Cargo.toml and Cargo.lock must agree.
      - name: Verify version files
        if: steps.version.outputs.release == 'true'
        run: node scripts/release-prepare.mjs --check --newer-than-tag

      - name: Create tag
        if: steps.version.outputs.release == 'true'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.version.outputs.version }}
          tag_prefix: v

      - name: Release notes from CHANGELOG.md
        id: notes
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "notes<<XPASS_NOTES_EOF"
            node scripts/release-prepare.mjs --notes "$VERSION"
            echo "XPASS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build (Windows x64)
    needs: tag-release
    if: always() && !cancelled() && ((github.event_name == 'push' && needs.tag-release.result == 'success' && needs.tag-release.outputs.released == 'true') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && needs.tag-release.outputs.new_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag-release.outputs.new_tag }}
          releaseName: ${{ needs.tag-release.outputs.new_tag }}
          releaseBody: ${{ needs.tag-release.outputs.notes }}
          releaseDraft: false
          prerelease: false
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      # Builds are not code-signed yet: publish SHA-256 checksums of the installers as
      # they were uploaded (names and bytes from the release itself), so a download can
      # be checked with `Get-FileHash` (v0.6 plan H11).
      - name: Publish SHA256SUMS.txt
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-release.outputs.new_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $dir --pattern '*.exe' --pattern '*.msi'
          if ($LASTEXITCODE -ne 0) { throw 'gh release download failed' }
          $files = Get-ChildItem $dir -File | Sort-Object Name
          if ($files.Count -eq 0) { throw 'no installers found in the release' }
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          # LF line endings, no BOM: the format `sha256sum -c` reads.
          [IO.File]::WriteAllText($sums, (($lines -join "`n") + "`n"))
          Get-Content $sums
          gh release upload $env:TAG $sums --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }

      - name: Build app bundles
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: xpass-windows-x64
          path: target/release/bundle/**
          retention-days: 14
          if-no-files-found: error
