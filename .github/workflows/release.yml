name: Release
# Adapted from xmark. Windows only.
# Requires "Settings > Actions > General > Workflow permissions" = "Read and write
# permissions" so the tag job can push the version-bump commit and tag to `main`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-release:
    name: Determine version and create tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
      released: ${{ steps.tag_version.outputs.new_tag != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main
          dry_run: true

      - name: Setup Node.js
        if: steps.tag_version.outputs.new_tag != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump version in project files
        if: steps.tag_version.outputs.new_tag != ''
        env:
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          set -euo pipefail
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
          sed -i "0,/^version = \".*\"/s//version = \"${NEW_VERSION}\"/" src-tauri/Cargo.toml
          # Refresh only the workspace members' entries in Cargo.lock (no dependency
          # upgrades). Not `--offline`: a fresh runner has no registry cache, so that
          # failed and `|| true` hid it — v0.5.0 shipped with `xpass 0.4.0` in the lock.
          cargo update --workspace

      - name: Verify version files agree
        if: steps.tag_version.outputs.new_tag != ''
        env:
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          set -euo pipefail
          # Fails if Cargo.lock still needs changes for the current manifests.
          cargo metadata --format-version 1 --locked > /dev/null
          toml_version=$(cargo metadata --format-version 1 --locked --no-deps \
            | jq -r '.packages[] | select(.name == "xpass") | .version')
          npm_version=$(jq -r .version package.json)
          npm_lock_version=$(jq -r .version package-lock.json)
          echo "expected=${NEW_VERSION} Cargo.toml=${toml_version} package.json=${npm_version} package-lock.json=${npm_lock_version}"
          if [ "$toml_version" != "$NEW_VERSION" ] || [ "$npm_version" != "$NEW_VERSION" ] || [ "$npm_lock_version" != "$NEW_VERSION" ]; then
            echo "::error::Version files disagree; not tagging."
            exit 1
          fi
          lock_entry=$(grep -A1 '^name = "xpass"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if [ "$lock_entry" != "$NEW_VERSION" ]; then
            echo "::error::Cargo.lock has xpass ${lock_entry}, expected ${NEW_VERSION}."
            exit 1
          fi

      - name: Commit version bump and push tag
        if: steps.tag_version.outputs.new_tag != ''
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml Cargo.lock

          if git diff --cached --quiet; then
            echo "Version files already at ${NEW_VERSION}; skipping bump commit."
          else
            git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${NEW_TAG}" > /dev/null; then
            echo "Tag ${NEW_TAG} already exists on origin; skipping tag creation."
          else
            git tag -a "$NEW_TAG" -m "$NEW_TAG"
            git push origin "$NEW_TAG"
          fi

  build-and-release:
    name: Build (Windows x64)
    needs: tag-release
    if: always() && !cancelled() && ((github.event_name == 'push' && needs.tag-release.result == 'success' && needs.tag-release.outputs.released == 'true') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && needs.tag-release.outputs.new_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.tag-release.outputs.new_tag }}
          releaseName: ${{ needs.tag-release.outputs.new_tag }}
          releaseBody: ${{ needs.tag-release.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"

      - name: Build app bundles
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: xpass-windows-x64
          path: target/release/bundle/**
          retention-days: 14
          if-no-files-found: error
